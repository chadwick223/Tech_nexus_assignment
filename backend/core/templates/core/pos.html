{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Point of Sale</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <div class="app-container">
        <!-- AI Assistant Panel (Left) -->
        <div class="panel ai-panel">
            <div class="panel-header">
                <h2>AI Assistant</h2>
                <p>Speak, type, or upload to add items.</p>
            </div>
            
            <div class="input-section">
                <!-- Voice Controls -->
                <div class="voice-box">
                    <button id="btn-record" class="btn-voice">
                        <span id="record-text">Start Listening</span>
                    </button>
                    <p id="voice-status" class="status-text text-muted">Ready to record...</p>
                </div>

                <div class="divider">OR</div>

                <!-- Text & Image Controls -->
                <form id="command-form" class="text-box">
                    <textarea id="command-text" placeholder="e.g., 'Add 2 kg apples' or 'Remove 1 milk'" rows="3"></textarea>
                    
                    <div class="upload-box" style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                        <label for="command-image" class="btn-upload">Upload Image</label>
                        <input type="file" id="command-image" accept="image/*" style="display: none;">
                        <button type="button" id="btn-camera" class="btn-upload">Open Camera</button>
                        <span id="file-name" class="text-muted">No file chosen</span>
                    </div>

                    <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin-top: 15px;">
                        Send Command
                    </button>
                </form>
            </div>
            
            <div id="ai-feedback" class="feedback-box hidden">
                <!-- AI Feedback shows here -->
            </div>
        </div>

        <!-- Billing Summary Panel (Right) -->
        <div class="panel cart-panel">
            <div class="panel-header">
                <h2>Current Order</h2>
                <p>Live billing summary</p>
            </div>

            <!-- MANUAL ADD SECTION -->
            <div class="manual-add-section" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <select id="manual-item-select" style="flex: 1; padding: 10px; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #333;">
                    <option value="" disabled selected>Loading inventory...</option>
                </select>
                <input type="number" id="manual-qty" value="1" min="1" style="width: 80px; padding: 10px; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #333;">
                <button onclick="manualAdd()" class="btn-primary" style="padding: 10px 20px;">Add Item</button>
            </div>

            <div class="cart-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <div class="cart-footer">
                <div class="grand-total">
                    <span>Grand Total:</span>
                    <span id="grand-total-amount">₹0.00</span>
                </div>
                <div class="action-buttons">
                    <button id="btn-clear" class="btn-danger">Clear Cart</button>
                    <button id="btn-checkout" class="btn-success">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Camera Modal -->
    <div id="camera-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: #1e1e1e; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333;">
            <h3 style="margin-bottom: 15px;">Capture Product/Receipt</h3>
            <video id="camera-preview" autoplay playsinline style="width: 100%; max-width: 400px; border-radius: 8px; margin-bottom: 15px;"></video>
            <canvas id="camera-canvas" style="display: none;"></canvas>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="btn-capture" class="btn-success">Snap Photo</button>
                <button type="button" id="btn-close-camera" class="btn-danger">Cancel</button>
            </div>
        </div>
    </div>

    <script src="{% static 'core/app.js' %}"></script>
</body>
</html>
